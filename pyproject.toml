[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "titanpkg"
version = "0.1.0"
description = "Standalone package manager for ArchTitan OS subsystems"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "ArchTitan OS contributors" }]
keywords = ["archlinux", "package-manager", "archtitan", "wayland", "qt6"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Software Distribution",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
titanpkg = "titanpkg.cli:main"

[project.urls]
Homepage = "https://github.com/GitGuru29/Titan-pm"
Documentation = "https://github.com/GitGuru29/Titan-pm/tree/main/docs"
Repository = "https://github.com/GitGuru29/Titan-pm"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
titanpkg = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["titanpkg"]
