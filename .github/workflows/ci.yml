name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'

      - name: Lint
        run: python -m ruff check src tests packaging

      - name: Test
        run: python -m pytest

      - name: Type check
        if: matrix.python == '3.12'
        run: python -m mypy
        continue-on-error: true
